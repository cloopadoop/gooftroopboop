[package]
name = "goof-troop-boop"
version = "0.1.1"
description = "Goof Troop Boop - Capcom SNES music editor"
edition = "2021"

[lib]
name = "goof_troop_boop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# Thin LTO at opt-level "s" ran LLVM out of memory on the development machine
# (STATUS_STACK_BUFFER_OVERRUN). The Rust side is a thin shell around the C++
# sidecar, so a lighter profile costs little size or speed.
opt-level = 1
lto = false
codegen-units = 16
