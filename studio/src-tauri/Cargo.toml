[package]
name = "goof-troop-boop"
version = "0.1.0"
description = "Goof Troop Boop - Capcom SNES music editor"
edition = "2021"

[lib]
name = "goof_troop_boop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
